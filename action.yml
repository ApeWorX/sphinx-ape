name: 'sphinx-ape-action'
author: 'ApeWorX Ltd.'
description: 'Build documentation for Ape-like packages'
branding:
  icon: 'book'
  color: 'green'

inputs:
  python-version:
    # Unused by this composite today (callers run setup-uv themselves). Kept for
    # forward-compat / existing workflow inputs; do not remove without a major bump.
    description: 'Override version of python, defaults to 3.10'
    required: false
    default: '3.10'
  github-token:
    description: 'Token for pushing to GitHub and authenticated API calls during the build'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Build Docs
      run: |
        sphinx-ape build --mode "${{ github.event_name }}"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Doctesting
      run: |
        sphinx-ape test
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Commit and publish documentation changes to gh-pages branch
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'release' }}
      run: |
        sphinx-ape publish --skip-push --repo ${{ github.repository }}
        cd gh-pages
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Update documentation" -a || true
      shell: bash

    - name: Push changes
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'release' }}
      uses: ad-m/github-push-action@master
      with:
        branch: gh-pages
        directory: gh-pages
        github_token: ${{ inputs.github-token }}
